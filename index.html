<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Annotation Tool</title>
  <style>
    body { font-family: Arial; text-align: center; }
    img { max-height: 400px; margin: 20px; }
    button { font-size: 20px; padding: 10px 20px; margin: 10px; }
    .selected { background-color: green; color: white; }
  </style>
</head>

<body>

<h2 id="counter"></h2>



<div>
  <button id="male">Male (←)</button>
  <button id="female">Female (→)</button>
</div>

<br>
<button onclick="download()">Download CSV</button>

<script>
let data = [];
let index = 0;

// === LOAD CSV ===
fetch("one_per_group_with_export_status.csv")
  .then(r => r.text())
  .then(text => {

    const rows = text.trim().split("\n").map(r => r.split(","));
    const headers = rows[0];

    let all = rows.slice(1).map(r => {
      let obj = {};
      headers.forEach((h, i) => obj[h] = r[i] || "");
      return obj;
    });

    // ✅ KEEP ONLY SUCCESSFUL EXPORTS
    data = all.filter(r => r.export_success === "True" || r.export_success === true);

    // ✅ OPTIONAL: randomize (REMOVE if you want fixed order)
    // data.sort(() => Math.random() - 0.5);

    update();
  });

// === IMAGE NAME FROM used_filepath ===
function getImageName(row) {
  return row.used_filepath.split("/").pop().replace(".mp4", ".jpg");
}

// === DISPLAY ===
function update() {
  if (index >= data.length) {
    document.body.innerHTML = "<h2>✅ Finished!</h2><button onclick='download()'>Download CSV</button>";
    return;
  }

  const row = data[index];

  document.getElementById("counter").innerText =
    `${index + 1} / ${data.length}`;

  const imgPath = "images/" + getImageName(row);

  const imgElement = document.getElementById("image");

  // ✅ SKIP MISSING IMAGES AUTOMATICALLY
  imgElement.onerror = () => {
    console.log("Skipping missing:", imgPath);
    index++;
    update();
  };

  imgElement.src = imgPath;

  document.getElementById("male").classList.toggle(
    "selected", row.sex === "male"
  );
  document.getElementById("female").classList.toggle(
    "selected", row.sex === "female"
  );
}

// === SELECTION ===
function select(sex) {
  data[index].sex = sex;
  index++;
  update();
}

// === KEYBOARD ===
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") select("male");
  if (e.key === "ArrowRight") select("female");
});

// === BUTTONS ===
document.getElementById("male").onclick = () => select("male");
document.getElementById("female").onclick = () => select("female");

// === EXPORT ===
function download() {
  const headers = Object.keys(data[0]);
  const rows = data.map(r => headers.map(h => r[h]).join(","));
  const csv = [headers.join(","), ...rows].join("\n");

  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "annotated.csv";
  a.click();
}
</script>

</body>
</html>
